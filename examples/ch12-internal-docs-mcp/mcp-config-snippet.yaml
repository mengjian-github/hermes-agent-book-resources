# Merge into the active Profile config.yaml; replace BOTH absolute paths.
mcp_servers:
  book-internal-docs:
    command: "/absolute/path/to/repo/.venv/bin/python"
    args:
      - "/absolute/path/to/repo/examples/ch12-internal-docs-mcp/server.py"
    enabled: true
    tools:
      include: [search_docs, read_doc]
      prompts: false
      resources: false
    sampling:
      enabled: false
